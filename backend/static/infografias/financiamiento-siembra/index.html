<script>
(function(){
const fmt=(v,d=0)=>v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const $=id=>document.getElementById(id);
const TOTAL=14747;

/* ---------- datos del informe (Informativo Semanal, 02/10/2026) ---------- */
const G={
 propio:{name:'Capital propio',short:'Capital propio',v:4424,color:'#c9d0dc',leaves:[]},
 bancos:{name:'Crédito bancario y MAV',short:'Bancos y MAV',v:4609,color:'#5e7092',leaves:[
  {k:'bullet',n:'Préstamos bullet (pago íntegro)',v:1114,p:24.2,c:'#3f5480',d:'Fue el instrumento bancario más utilizado. El productor recibe todo el capital al inicio y no hace pagos parciales: capital e intereses se cancelan en un único pago al vencimiento. Así puede hacer coincidir ese pago con la cosecha y la venta, cuando recupera liquidez. Son operaciones sin convenio con proveedores ni plataformas y sin garantía prendaria ni hipotecaria: crédito otorgado contra la firma del tomador.',kw:['Pago único al vencimiento','Coincide con la cosecha','Sin garantía real'],note:''},
  {k:'hipo',n:'Hipotecarios y prendarios',v:925,p:20.1,c:'#4c618b',d:'Son créditos respaldados por garantías reales: los hipotecarios, sobre inmuebles, y los prendarios, sobre bienes muebles como maquinarias y equipos. Esa garantía le permite al productor acceder a financiamiento de mayor plazo y con tasas más competitivas que las de los créditos sin garantía.',kw:['Garantía real','Mayor plazo','Tasas más competitivas'],note:''},
  {k:'cheques',n:'Descuento de cheques y pagarés',v:676,p:14.7,c:'#5a6e96',d:'Los bancos adelantan fondos por cheques y pagarés a cambio de una tasa de descuento: el productor obtiene liquidez hoy contra documentos que vencen más adelante.',kw:['Adelanto de fondos','Tasa de descuento'],note:''},
  {k:'plataformas',n:'Convenio de tasas para insumos (plataformas)',v:669,p:14.5,c:'#6a7da2',d:'A través de distintas plataformas digitales, los productores acceden a líneas de crédito para comprar insumos, con convenios de tasa con las empresas proveedoras. Es una modalidad que creció de forma significativa en las últimas dos campañas.',kw:['Plataformas digitales','Compra de insumos','En crecimiento'],note:''},
  {k:'otras',n:'Otras líneas bancarias y MAV',v:573,p:12.4,c:'#7a8cae',d:'Agrupa instrumentos de dos ámbitos. Del lado bancario: forwards cedidos (el banco adelanta fondos contra la cesión de contratos de venta de granos con entrega futura), prefinanciación de exportaciones, créditos para inversiones y microcréditos. Del lado del mercado de capitales, en el MAV se destacan los pagarés, los cheques de pago diferido y las facturas de crédito electrónicas.',kw:['Forwards cedidos','Pagarés y cheques en el MAV'],note:''},
  {k:'tarjetas',n:'Tarjetas agro',v:346,p:7.5,c:'#8c9cba',d:'Diseñadas a la medida del ciclo productivo: permiten comprar insumos y maquinaria al momento de la siembra y pagar recién a la cosecha, con vencimientos adaptados a cada cultivo.',kw:['Pago a cosecha','Insumos y maquinaria'],note:''},

 comercial:{name:'Crédito comercial',short:'Crédito comercial',v:5713,color:'#193363',leaves:[
  {k:'corredores',n:'Corredores, acopios y cooperativas',v:3142,p:55,c:'#193363',d:'Concentraron más de la mitad del crédito comercial. La mayor parte del financiamiento se hizo en modalidad de canje o con pago en dólares contra un contrato de granos. También se usaron cuentas corrientes en dólares.',kw:['Canje','Dólares contra contrato de granos'],note:'canje'},

const light=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>160};

/* ---------- squarified treemap ---------- */
function squarify(items,x,y,w,h){
  const out=[];const tot=items.reduce((a,b)=>a+b.v,0);if(!tot)return out;
  let rest=items.slice().sort((a,b)=>b.v-a.v).map(it=>({it,a:it.v/tot*w*h}));
  while(rest.length){
    const side=Math.min(w,h);let row=[],best=Infinity;
    for(const r of rest){const t=row.concat(r);const s=t.reduce((a,b)=>a+b.a,0);const mx=Math.max(...t.map(q=>q.a)),mn=Math.min(...t.map(q=>q.a));
      const worst=Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn));if(worst<=best){best=worst;row=t}else break}
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){const rw=s/h;let yy=y;row.forEach(r=>{const rh=r.a/rw;out.push({it:r.it,x,y:yy,w:rw,h:rh});yy+=rh});x+=rw;w-=rw}
    else{const rh=s/w;let xx=x;row.forEach(r=>{const rw=r.a/rh;out.push({it:r.it,x:xx,y,w:rw,h:rh});xx+=rw});y+=rh;h-=rh}
    rest=rest.slice(row.length)}
  return out;
}
// level 1: the three sources
function groupRects(W,H){
  const items=['propio','bancos','comercial'].map(g=>({k:g,v:G[g].v}));
  const R={};
  // keep reading order propio → bancos → comercial along the longer side
  let acc=0;items.forEach(it=>{const f=it.v/TOTAL;
    R[it.k]=W>=H?{x:W*acc,y:0,w:W*f,h:H}:{x:0,y:H*acc,w:W,h:H*f};acc+=f});
  return R;
}
function layout(W,H,view){
  const GR=groupRects(W,H);const R={},vis={};
  const focus=view==='total'?null:view;
  const map=focus?(r=>{const g=GR[focus];return {x:(r.x-g.x)*W/g.w,y:(r.y-g.y)*H/g.h,w:r.w*W/g.w,h:r.h*H/g.h}}):(r=>r);
  for(const g of ['propio','bancos','comercial']){
    const gr=GR[g];
    R['G_'+g]=map(gr);vis['G_'+g]=!focus||(focus===g&&g==='propio');
    if(g==='propio')continue;
    if(focus===g){squarify(G[g].leaves,0,0,W,H).forEach(q=>{R[q.it.k]={x:q.x,y:q.y,w:q.w,h:q.h};vis[q.it.k]=true})}
    else squarify(G[g].leaves,gr.x,gr.y,gr.w,gr.h).forEach(q=>{R[q.it.k]=map({x:q.x,y:q.y,w:q.w,h:q.h});vis[q.it.k]=false});
  }
  return {R,vis};
}

/* ---------- tiles ---------- */
const tm=$('tm');tm.classList.add('noanim');const tiles={};
function mkTile(key,g,label,v,color,sub){
  const d=document.createElement('div');d.className='tile';d.dataset.k=key;d.dataset.g=g;d.style.background=color;d.style.color=light(color)?'#193363':'#fff';
  d.setAttribute('role','button');d.tabIndex=0;
  d.innerHTML=`<div class="tn">${label}</div><div class="tv">US$ ${fmt(v)} M</div>${sub?`<div class="tm2">${sub}</div>`:''}<div class="tp"></div>`;
  d.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();d.click()}});
  d.addEventListener('pointerleave',()=>hideTip());
  tm.appendChild(d);tiles[key]=d;return d;
}
for(const g of ['propio','bancos','comercial']){
  const t=mkTile('G_'+g,g,G[g].name,G[g].v,G[g].color,g==='propio'?'':`Ver ${G[g].leaves.length} ${g==='bancos'?'instrumentos':'orígenes'} ›`);
  t.classList.add('grp');
  t.addEventListener('click',ev=>{ev.stopPropagation();hideTip();if(cur==='total')go(g)});
  t.addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse'||cur!=='total')return;showTip(ev,`<h4>${G[g].name}</h4><div class="r"><span>Monto</span><span>US$ ${fmt(G[g].v)} M</span></div><div class="r t"><span>Del total</span><span>${fmt(G[g].v/TOTAL*100,1)}%</span></div>`)});
  G[g].leaves.forEach(l=>{if(g==='propio')return;
    const d=mkTile(l.k,g,l.n,l.v,l.c,'');
    d.addEventListener('click',ev=>{ev.stopPropagation();hideTip();if(cur===g)pick(l.k)});
    d.addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse'||cur!==g)return;showTip(ev,`<h4>${l.n}</h4><div class="r"><span>Monto</span><span>US$ ${fmt(l.v)} M</span></div><div class="r"><span>Del canal</span><span>${fmt(l.p,l.p%1?1:0)}%</span></div><div class="r t"><span>Del total</span><span>${fmt(l.v/TOTAL*100,1)}%</span></div>`)});
  });
}
const tip=$('tip');
function showTip(ev,html){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+12,y=ev.clientY-h-12;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(x<8)x=8;if(y<8)y=ev.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.classList.remove('on')}

let picked=null;
function place(){
  const W=tm.clientWidth,H=tm.clientHeight;if(!W||!H)return;
  const L=layout(W,H,cur);
  for(const k in tiles){const r=L.R[k],t=tiles[k];if(!r)continue;const on=L.vis[k];
    t.style.left=(r.x+1)+'px';t.style.top=(r.y+1)+'px';t.style.width=Math.max(0,r.w-2)+'px';t.style.height=Math.max(0,r.h-2)+'px';
    t.style.opacity=on?1:0;t.style.pointerEvents=on?'auto':'none';t.style.zIndex=t.classList.contains('grp')?(on?2:0):1;
    t.classList.remove('xs','s','sn','l','xl');const area=r.w*r.h;
    if(r.w<56||r.h<24)t.classList.add('xs');else if(r.w<100||r.h<64){t.classList.add('s');if(r.h<42)t.classList.add('sn')}else if(area>60000)t.classList.add('xl');else if(area>16000)t.classList.add('l');
    t.classList.toggle('notp',r.h<104&&!t.classList.contains('xl'));
    const g=t.dataset.g;let p='';
    if(t.classList.contains('grp'))p=fmt(G[g].v/TOTAL*100,1).replace(',0','')+'%';
    else{const l=G[g].leaves.find(q=>q.k===k);p=fmt(l.p,l.p%1?1:0)+'%'}
    t.querySelector('.tp').textContent=p;
    t.classList.toggle('sel',picked===k)}
}

/* ---------- views ---------- */
const V={
 total:{title:'¿Cómo se financió la siembra de la campaña 2025/26?',
   
   ctitle:'Fuentes de financiamiento',
   text:'Sembrar la campaña demandó <b>US$ 14.747 millones</b> en insumos, siembra y pulverización, que el productor pagó antes de cosechar. La mayor parte se cubrió con <b>crédito de terceros</b>, sobre todo con el <b>crédito comercial</b> de la propia cadena. Además, ganó peso el <b>financiamiento en dólares</b>.',
   hint:'Tocá un bloque para ver el detalle'},
 propio:{title:'Capital propio de los productores',
   ctitle:'Capital propio',
   text:'Según las consultas al sector, los productores habrían aportado unos <b>US$ 4.424 millones</b> de sus propias carteras. El resto, unos <b>US$ 10.323 millones</b>, llegó de terceros: bancos y MAV, y crédito comercial.'},
 bancos:{title:'Crédito bancario y MAV',
   ctitle:'Crédito bancario y MAV',
   text:'Bancos y MAV aportaron <b>US$ 4.609 millones</b>, el 45% del crédito de terceros. El <b>préstamo bullet</b> fue el más usado (24%): se paga todo junto al vencimiento, en coincidencia con la cosecha. Crecieron las <b>plataformas</b> con convenio de tasas para comprar insumos.',
   hint:'Tocá cada instrumento para saber cómo funciona'},
 comercial:{title:'Crédito comercial',
   ctitle:'Crédito comercial',
   text:'Como es habitual, la mayor parte del crédito de terceros vino de la <b>propia cadena</b>: <b>US$ 5.713 millones</b>, el 55%. <b>Corredores, acopios y cooperativas</b> aportaron el 55%, mayormente en canje o en dólares contra contratos de granos.',
   hint:'Tocá cada bloque para ver cómo funciona'}
};
const SRC='@BCRmercados: consultas al sector y est. propias';
let cur='total';
function textFor(v){
  return `<p>${v.text}</p>`+(v.hint?`<p class="hint"><span class="arr" aria-hidden="true"><span class="am">↓</span><span class="ad">→</span></span>${v.hint}</p>`:'');
}
function render(){
  const v=V[cur];picked=null;
  $('hero').textContent=V.total.title;
  $('ctitle').textContent=v.ctitle;$('ctitle').title=v.ctitle;$('csrc').textContent=SRC;
  $('text').innerHTML=textFor(v);
  $('crow').innerHTML=cur==='total'?'':`<button type="button" class="home" id="crumbTotal"><span aria-hidden="true">←</span> Cuadro principal</button>`;
  const ct=$('crumbTotal');if(ct)ct.onclick=()=>go('total');
  requestAnimationFrame(place);
}
const modal=$('modal');let lastFocus=null;
function pick(k){
  const g=cur;const l=G[g].leaves.find(q=>q.k===k);if(!l||g==='propio')return;
  picked=k;place();lastFocus=document.activeElement;
  $('mch').textContent=G[g].name;$('mtitle').textContent=l.n;
  $('mfig').innerHTML=`<div><b>US$ ${fmt(l.v)} M</b><span>monto estimado</span></div><div><b>${fmt(l.p,l.p%1?1:0)}%</b><span>del canal</span></div><div><b>${fmt(l.v/TOTAL*100,1)}%</b><span>del total financiado</span></div>`;
  $('mbar').innerHTML=`<i style="width:${l.p}%;background:${l.c}"></i>`;
  $('mdesc').textContent=l.d;
  $('mnote').innerHTML=l.note==='canje'?'<b>¿Qué es el canje?</b> El productor recibe insumos hoy y los paga con granos de la cosecha futura.':'';
  modal.hidden=false;$('mclose').focus();
}
function closeModal(){if(modal.hidden)return;modal.hidden=true;picked=null;place();if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('mclose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
function go(v){if(!V[v])return;if(v===cur)return;closeModal();cur=v;hideTip();render();try{history.replaceState(null,'','#'+v)}catch(e){}}
document.addEventListener('click',hideTip);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!modal.hidden){closeModal();return}if(cur!=='total')go('total')});

const h=(location.hash||'').slice(1);if(V[h])cur=h;
let raf;new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(place)}).observe(tm);
render();
setTimeout(()=>tm.classList.remove('noanim'),120);
})();
</script>
