<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Más BCR · Kit Multimedia | __VERSION__</title>
<script src="/static/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00314b;--cyan:#009ee3;--line:#e5e7eb;--muted:#6b7280;--f:"Outfit",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:#f3f4f6;color:#1f2937}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header .brand{font-weight:800;font-size:18px}header .brand span{color:var(--cyan)}
  header .sub{font-size:12px;color:#9fb3c2}
  header a{color:#cfe6f4;font-size:13px;font-weight:600;text-decoration:none}
  .wrap{max-width:1000px;margin:22px auto;padding:0 18px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:600;font-size:14px;padding:9px 16px}
  .btn-primary{background:var(--cyan);color:#04303f}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tabs button{background:#fff;border:1px solid var(--line);color:#374151}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .bar h2{color:var(--navy);font-weight:800;font-size:20px}
  .bar p{color:var(--muted);font-size:13px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .cell{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#e5e7eb;border:1px solid var(--line)}
  .cell img{width:100%;height:100%;object-fit:cover}
  .cell button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(220,38,38,.92);color:#fff;font-weight:700;padding:0;line-height:1}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none}
</style>
</head>
<body>
<header>
  <span class="brand">+<span>BCR</span></span><span class="sub">Kit Multimedia</span>
  <div style="margin-left:auto;display:flex;gap:16px">
    <a href="/noticias/admin">← Noticias</a>
    <a href="/noticias/kit" target="_blank">Ver Kit ↗</a>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div><h2 id="cat-nombre">—</h2><p id="cat-desc"></p></div>
    <button class="btn-primary" id="btn-add">+ Subir imágenes</button>
  </div>
  <div class="grid" id="grid"><div class="empty">Cargando…</div></div>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
const KAPI='/api/kit', UPLOAD='/api/noticias/upload';
let categorias=[], assets=[], current=null;
const $=s=>document.querySelector(s);
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

async function load(){
  const r=await fetch(KAPI); if(!r.ok){toast('No se pudo cargar');return;}
  const d=await r.json(); categorias=d.categorias||[]; assets=d.assets||[];
  if(!current) current=categorias[0]?.slug;
  renderTabs(); renderGrid();
}
function renderTabs(){
  $('#tabs').innerHTML=categorias.map(c=>{
    const n=assets.filter(a=>a.kit_cat===c.slug).length;
    return `<button class="${c.slug===current?'on':''}" onclick="pick('${c.slug}')">${esc(c.nombre)} (${n})</button>`;
  }).join('');
  const c=categorias.find(x=>x.slug===current);
  $('#cat-nombre').textContent=c?c.nombre:'—';
  $('#cat-desc').textContent=c?c.desc:'';
}
function renderGrid(){
  const items=assets.filter(a=>a.kit_cat===current);
  if(!items.length){$('#grid').innerHTML='<div class="empty">Esta galería está vacía. Subí imágenes.</div>';return;}
  $('#grid').innerHTML=items.map(a=>`
    <div class="cell"><img src="${esc(a.url)}" alt=""><button title="Eliminar" onclick="del(${a.id})">×</button></div>`).join('');
}
function pick(slug){current=slug;renderTabs();renderGrid();}

async function del(id){
  if(!confirm('¿Eliminar esta imagen del kit?'))return;
  const r=await fetch(`${KAPI}/${id}`,{method:'DELETE'});
  if(r.ok){assets=assets.filter(a=>a.id!==id);renderTabs();renderGrid();toast('Eliminada');}else toast('Error');
}

$('#btn-add').onclick=()=>$('#file-input').click();
$('#file-input').onchange=async e=>{
  const files=[...e.target.files]; e.target.value='';
  if(!files.length)return;
  let ok=0;
  for(const f of files){
    toast(`Subiendo ${ok+1}/${files.length}…`);
    const fd=new FormData();fd.append('file',f);
    const ur=await fetch(UPLOAD,{method:'POST',body:fd});
    if(!ur.ok)continue;
    const url=(await ur.json()).url;
    const cr=await fetch(KAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kit_cat:current,url})});
    if(cr.ok){assets.push(await cr.json());ok++;}
  }
  renderTabs();renderGrid();
  toast(`Listo: ${ok} imagen(es) subidas`);
};

load();
</script>
</body>
</html>
