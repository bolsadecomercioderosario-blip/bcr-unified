<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claves — Recortes</title>
<!-- Login centralizado del hub. Debe ir antes de cualquier fetch. -->
<script src="/static/auth.js?v=__VERSION__"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#111c2e;--line:#334155;--tx:#e7eef5;
--mut:#94a3b8;--agro:#34d399;--fin:#60a5fa;--otro:#a78bfa;--acc:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);
font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5}
a{color:#6cc0ff}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;
align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:5}
header .home{font-size:20px;text-decoration:none}
h1{font-size:18px;margin:0;font-weight:800}.sub{color:var(--mut);font-size:13px;font-weight:500}
.wrap{max-width:900px;margin:0 auto;padding:22px}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.job h2{font-size:17px;margin:0 0 2px}.state{font-size:12px;color:var(--mut);margin-bottom:16px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;color:#06210f;text-transform:uppercase;letter-spacing:.03em}
/* Lista 1-columna: cada recorte a ancho completo, miniatura a la izquierda */
.cand{display:flex;gap:16px;background:var(--card2);border:1px solid var(--line);
border-radius:12px;padding:14px;margin-bottom:14px}
.cand .thumb{flex:0 0 300px}
.cand .thumb img{width:300px;height:169px;object-fit:cover;border-radius:8px;background:#000;display:block}
.cand .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.meta{font-size:12.5px;color:var(--mut)}
.tcrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.desc{font-size:14.5px;font-weight:600;color:#eaf2f9}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin-bottom:2px}
.txt{font-size:13.5px;color:#cdd9e3;background:#0a1118;border:1px solid var(--line);
border-radius:8px;padding:10px 12px;max-height:190px;overflow:auto;white-space:pre-wrap}
.row{display:flex;align-items:center;gap:12px;justify-content:flex-start;margin-top:2px}
.chk{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px;cursor:pointer}
button{background:var(--acc);color:#2a1a02;border:0;border-radius:8px;padding:9px 18px;
font-weight:700;cursor:pointer;font-size:13.5px;font-family:inherit}
button:disabled{opacity:.55;cursor:default}
.pill{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;display:inline-block}
.pill.proc{background:rgba(245,158,11,.15);color:#fbbf24}
.pill.err{background:rgba(248,113,113,.15);color:#f87171}
video{width:100%;max-width:360px;border-radius:8px;background:#000}
.empty{color:var(--mut);padding:50px;text-align:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fbbf24;margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media(max-width:680px){.cand{flex-direction:column}.cand .thumb,.cand .thumb img{flex:none;width:100%}}
</style>
</head>
<body>
<header>
  <a href="/" class="home" title="Volver al Hub">🏠</a>
  <h1>Claves <span class="sub">· recortes por especialista</span></h1>
</header>
<div class="wrap">
  <div id="jobs"><div class="empty">Cargando…</div></div>
</div>
<script>
const TOPIC={agro:'var(--agro)',finanzas:'var(--fin)',otro:'var(--otro)'};
function badge(t){return '<span class="badge" style="background:'+(TOPIC[t]||'#889')+'">'+t+'</span>'}
function tc(s){const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function generar(vid,cid,btn){
  const zoom=btn.parentElement.querySelector('.zoom').checked;
  btn.disabled=true; btn.textContent='Pidiendo…';
  try{
    const r=await fetch('/api/claves/render',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({video_id:vid,cid:cid,zoom:zoom})});
    if(!r.ok){const d=await r.json().catch(()=>({})); throw new Error(d.detail||'Error');}
  }catch(e){ btn.disabled=false; btn.textContent='Generar reel'; alert(e.message||'Error'); return; }
  setTimeout(load,800);
}

function controls(vid,c){
  const r=c.render;
  if(r && r.estado==='listo' && r.video_url){
    return '<div class="row" style="flex-direction:column;align-items:flex-start;gap:6px">'+
      '<video controls preload="metadata" src="'+r.video_url+'"></video>'+
      '<div class="meta">✅ listo · <a href="'+r.video_url+'" target="_blank" rel="noopener" download>⬇ descargar MP4</a>'+
      (r.zoom?' · zoom-crop':'')+'</div></div>';
  }
  if(r && (r.estado==='procesando')) return '<div class="pill proc"><span class="dot"></span>Generando en la PC local…</div>';
  if(r && (r.estado==='pendiente')) return '<div class="pill proc"><span class="dot"></span>En cola…</div>';
  const errline = (r && r.estado==='error') ? '<div class="pill err">Falló. Reintentá.</div>' : '';
  return errline+
    '<div class="row">'+
    '<label class="chk"><input type="checkbox" class="zoom"> zoom-crop</label>'+
    '<button onclick="generar(\''+vid+'\',\''+c.cid+'\',this)">Generar reel</button>'+
    '</div>';
}

function cand(vid,c){
  const thumb = c.thumb_url ? '<div class="thumb"><img src="'+c.thumb_url+'" loading="lazy"></div>' : '';
  return '<div class="cand">'+thumb+'<div class="body">'+
    '<div class="tcrow">'+badge(c.topic)+'<span class="meta"><b>'+tc(c.start)+' – '+tc(c.end)+'</b> · '+Math.round(c.dur)+'s</span></div>'+
    (c.desc ? '<div class="desc">'+esc(c.desc)+'</div>' : '')+
    '<div><div class="lbl">Transcripción</div><div class="txt">'+esc(c.text||'')+'</div></div>'+
    controls(vid,c)+
    '</div></div>';
}

async function load(){
  let data;
  try{ const r=await fetch('/api/claves/programas'); if(!r.ok) return; data=await r.json(); }
  catch(e){ return; }
  const jobs=data.programas||[];
  const box=document.getElementById('jobs');
  if(!jobs.length){ box.innerHTML='<div class="empty">Todavía no hay programas procesados.<br>Los lunes/martes, al rato de salir el vivo, aparecen acá los recortes propuestos.</div>'; return; }
  box.innerHTML=jobs.map(function(j){
    const cs=(j.candidatos||[]);
    const body = cs.length ? cs.map(c=>cand(j.video_id,c)).join('') : '<div class="meta">Sin candidatos.</div>';
    const fecha = j.fecha ? (' · '+j.fecha) : '';
    return '<div class="job"><h2>'+esc(j.title||j.video_id)+'</h2>'+
      '<div class="state">'+cs.length+' recortes propuestos'+fecha+'</div>'+body+'</div>';
  }).join('');
}
load(); setInterval(load,4000);
</script>
</body>
</html>
