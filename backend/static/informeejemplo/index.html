.head{grid-area:head}
.eyebrow{font-family:var(--title);font-size:15px;font-weight:600;font-variant:small-caps;letter-spacing:.04em;color:var(--ink-2);line-height:1.2}
.hero{font-family:var(--title);font-weight:700;line-height:1;font-size:clamp(40px,11.5vw,70px);letter-spacing:-.015em;white-space:nowrap;margin-top:2px;font-variant-numeric:lining-nums tabular-nums}
.hero .u{font-size:.46em;font-weight:600;letter-spacing:0}
.delta{font-size:13px;color:var(--ink-2);margin-top:5px}
.delta b{color:var(--ink);font-weight:600}
.delta .up{font-weight:700;color:var(--ink)}
.delta .up::before{content:"▲ ";font-size:.8em}

.chartwrap{grid-area:chart;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px 14px 8px}
.crow{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:6px}
.crow:has(#ctrl:empty):has(.chips[hidden]){display:none}
#ctrl:empty{display:none}
.ctitle{font-family:var(--title);font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csrc{font-size:10.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--brand);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;font-size:11.5px;font-weight:500;color:var(--ink)}
.seg button + button{border-left:1px solid var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:2px 8px}
.chips[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:1px 1px;font-size:11px;line-height:1.5;color:var(--ink);border-bottom:1.5px solid transparent;border-radius:0}
.chip i{width:10px;height:10px;border-radius:2px}
.chip[aria-pressed="true"]{border-bottom-color:var(--brand);font-weight:600}
.ch{flex:1;min-height:0;position:relative;margin-top:4px}
.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch text{font-family:var(--body);fill:var(--ink-2);font-size:10.5px}
.ch .v{fill:var(--ink);font-weight:600}
.ch.swap{animation:swap .35s ease-out}
@keyframes swap{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
[data-crop]{transition:opacity .15s}
.dim{opacity:.15}

.text{grid-area:text;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.text b{color:var(--ink);font-weight:600}
.cta{display:inline-flex;align-items:center;gap:6px;margin-top:6px;border:0;background:transparent;padding:0;font-family:var(--title);font-weight:700;color:var(--brand);font-size:14px;border-bottom:1px solid var(--brand)}
.cta span{transition:transform .15s}
.cta:hover span{transform:translateX(3px)}

.chain{grid-area:chain;display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:0}
.node{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:6px 2px 7px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;transition:background .2s,color .2s}
.node .k{font-family:var(--title);font-size:12px;font-variant:small-caps;letter-spacing:.04em;color:var(--ink-3);font-weight:600;line-height:1.1}
.node .n{font-family:var(--title);font-weight:700;font-size:clamp(11px,3.1vw,20px);line-height:1.1;font-variant-numeric:lining-nums;white-space:nowrap;letter-spacing:-.01em}
.node .s{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node:hover{background:var(--b10)}
.node[aria-current="step"]{background:var(--brand);color:#fff}
.node[aria-current="step"] .k,.node[aria-current="step"] .s{color:#fff;opacity:.8}
.op{display:flex;align-items:center;justify-content:center;width:11px;font-family:var(--title);font-weight:700;color:var(--b50);font-size:16px}
.foot{grid-area:foot;font-size:10px;color:var(--ink-3);display:flex;justify-content:flex-end;gap:8px}
.hint{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600;font-size:13px;line-height:1.3;color:var(--brand)}
.hint .arr{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--brand);border-radius:50%;font-size:12px;animation:bob 1.6s ease-in-out 3}
@keyframes bob{50%{transform:translateY(3px)}}
.chain.invite .node{animation:invite 1.4s ease-in-out 2}
.chain.invite .node:nth-of-type(2){animation-delay:.12s}.chain.invite .node:nth-of-type(3){animation-delay:.24s}
@keyframes invite{50%{box-shadow:0 0 0 3px var(--b20)}}

#tip{position:fixed;pointer-events:none;z-index:10;background:var(--surface);border:1px solid var(--brand);box-shadow:0 6px 18px rgba(25,51,99,.18);border-radius:8px;padding:8px 10px;font-size:12px;min-width:160px;max-width:240px;opacity:0;transition:opacity .1s;color:var(--ink)}
#tip.on{opacity:1}
#tip h4{margin:0 0 4px;font-family:var(--title);font-size:13.5px}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
#tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
#tip .t{border-top:1px solid var(--hair);margin-top:4px;padding-top:4px;font-weight:600}
#tip .n{color:var(--ink-3);margin-top:3px}

@media (max-height:640px) and (max-width:899px){
  .hero{font-size:40px}
  .text{font-size:12.5px}
  .node{padding:4px 3px}
}
@media (min-width:900px){
  .app{padding:18px 24px;gap:12px 32px;grid-template-columns:340px minmax(0,1fr);
    grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:"top top" "head chart" "text chart" "chain chain" "foot foot"}
  .logo{width:150px;height:50px}
  .hero{font-size:62px}
  .eyebrow{font-size:17px}
  .text{font-size:15px;align-self:start}
  .chartwrap{padding:16px 20px 10px}
  .ctitle{font-size:18px}
  .csrc{font-size:11.5px}
  .ch text{font-size:11.5px}
  .node{padding:10px 8px}
  .node .n{font-size:24px}
  .node .k{font-size:14px}
  .node .s{font-size:11.5px}
  .op{width:34px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="logo" role="img" aria-label="Bolsa de Comercio de Rosario"></span>
    <span class="edition" id="follow"></span>
  </div>

  <div class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="hero num" id="hero"></div>
    <div class="delta" id="delta"></div>
  </div>

  <div class="chartwrap">
    <div class="ctitle" id="ctitle"></div><div class="csrc" id="csrc"></div>
    <div class="crow"><div id="ctrl"></div><div class="chips" id="chips" hidden></div></div>
    <div class="ch" id="ch"></div>
  </div>

  <div class="text" id="text"></div>

  <nav class="chain" aria-label="Cómo se arma la inversión">
    <button type="button" class="node" data-v="area"><span class="k">Área</span><span class="n num">39,9 M ha</span><span class="s">récord</span></button>
    <span class="op" aria-hidden="true">×</span>
    <button type="button" class="node" data-v="costo"><span class="k">Costo</span><span class="n num">US$ 370/ha</span><span class="s">promedio</span></button>
    <span class="op" aria-hidden="true">=</span>
    <button type="button" class="node" data-v="grano"><span class="k">Grano</span><span class="n">Maíz 1.º</span><span class="s">pasó a la soja</span></button>
    <span class="op" aria-hidden="true">→</span>
    <button type="button" class="node" data-v="total"><span class="k">Total</span><span class="n num">US$ 14.747 M</span><span class="s">+6,2%</span></button>
  </nav>

  <div class="foot"><span>Serie de área 1900–2015: valores aproximados</span></div>
</div>
<div id="tip" role="status"></div>

<script>
(function(){
const fmt=(v,d=0)=>v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const txt=(p,x,y,s,a={})=>{const t=el('text',Object.assign({x,y},a),p);t.textContent=s;return t};
const sign=v=>(v>=0?'+':'−')+fmt(Math.abs(v));
const pct=(v,d=1)=>(v>=0?'+':'−')+fmt(Math.abs(v),d)+'%';
const col=k=>`var(--c-${k})`;
const $=id=>document.getElementById(id);

/* ---------- tooltip (hover on desktop, tap on phone) ---------- */
const tip=$('tip');
function showTip(ev,html){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+12,y=ev.clientY-h-12;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(x<8)x=8;if(y<8)y=ev.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.classList.remove('on');
function hov(node,fn){node.addEventListener('pointermove',ev=>showTip(ev,fn()));node.addEventListener('pointerleave',hideTip);node.addEventListener('click',ev=>{showTip(ev,fn());ev.stopPropagation()})}
document.addEventListener('click',hideTip);

/* ---------- data ---------- */
const CROPS=[{k:'soja',n:'Soja'},{k:'maiz',n:'Maíz'},{k:'trigo',n:'Trigo'},{k:'girasol',n:'Girasol'},{k:'cebada',n:'Cebada'},{k:'sorgo',n:'Sorgo'}];
const CN=Object.fromEntries(CROPS.map(c=>[c.k,c.n]));
// historical area (approx., read from BCR chart): year, soja, maíz, trigo, girasol, cebada, sorgo
const A=[[1900,0,1.0,3.0,0,0.1,0],[1902,0,2.0,3.9,0,0.1,0],[1905,0,2.6,4.8,0,0.1,0],[1910,0,3.1,5.8,0,0.1,0],[1914,0,3.9,6.5,0,0.2,0],[1919,0,3.3,6.2,0,0.3,0],[1923,0,3.4,6.6,0,0.3,0],[1927,0,4.3,7.8,0,0.5,0],[1929,0,4.6,8.6,0,0.6,0],[1930,0,3.2,7.4,0.1,0.6,0],[1932,0,5.4,7.5,0.1,0.7,0],[1935,0,6.8,7.0,0.3,0.8,0],[1937,0,7.3,6.9,0.6,0.8,0],[1939,0,6.6,6.9,1.0,0.8,0],[1941,0,5.2,6.4,1.4,0.8,0],[1944,0,4.8,5.9,1.6,0.8,0],[1947,0,3.6,5.6,1.8,0.8,0],[1950,0,2.3,5.6,1.7,0.7,0.1],[1952,0,2.6,5.8,1.5,0.7,0.3],[1955,0,3.1,5.4,1.5,0.9,0.6],[1958,0,3.2,5.2,1.4,0.9,0.9],[1962,0,3.6,5.2,1.3,0.7,1.3],[1966,0.02,4.3,6.2,1.4,0.7,1.6],[1969,0.03,4.8,5.3,1.6,0.7,2.0],[1972,0.1,4.4,5.6,1.5,0.6,2.2],[1975,0.4,3.9,5.8,1.4,0.6,2.3],[1977,0.8,3.5,5.4,1.8,0.6,2.5],[1979,1.9,3.3,5.3,2.1,0.5,2.3],[1982,2.2,3.7,6.8,2.4,0.4,2.6],[1984,3.3,3.6,5.6,2.2,0.4,2.1],[1987,3.7,3.2,5.0,2.1,0.3,1.3],[1989,4.9,2.4,5.2,2.8,0.3,0.9],[1991,4.9,2.7,4.8,2.6,0.3,0.8],[1994,5.9,3.0,5.3,3.4,0.3,0.7],[1996,6.6,3.8,6.9,3.3,0.3,0.8],[1998,8.2,3.2,5.9,4.2,0.3,0.9],[2000,10.6,3.5,6.5,2.0,0.3,0.7],[2002,12.6,3.1,6.3,2.4,0.3,0.6],[2004,14.5,3.4,6.3,2.0,0.4,0.6],[2006,16.1,3.6,5.7,2.4,0.4,0.8],[2007,16.6,4.2,5.9,2.6,0.5,0.9],[2008,18.0,3.5,4.7,2.0,0.8,0.9],[2010,18.9,4.6,4.6,1.8,1.1,1.2],[2012,19.4,5.0,3.6,1.9,1.4,1.3],[2014,20.3,4.9,5.3,1.4,1.2,1.0],[2015,20.1,5.4,4.2,1.4,1.2,0.9],[2016,19.024,5.850,5.611,1.849,0.980,0.728],[2017,17.700,6.431,5.434,1.702,1.020,0.641],[2018,17.340,7.000,6.473,1.802,1.353,0.522],[2019,17.200,7.260,6.797,1.400,1.277,0.520],[2020,16.900,7.360,6.561,1.634,1.237,0.986],[2021,16.220,8.647,6.900,1.965,1.636,0.943],[2022,15.975,8.882,5.900,2.345,1.802,0.818],[2023,16.461,10.347,5.520,1.858,1.484,0.897],[2024,17.751,8.314,6.913,2.278,1.690,1.075],[2025,16.377,11.022,7.169,3.211,1.330,0.754]];
const years=[];for(let y=1900;y<=2025;y++)years.push(y);
const S=years.map(y=>{const i=A.findIndex(r=>r[0]>=y);if(A[i][0]===y)return A[i].slice(1);const a=A[i-1],b=A[i],t=(y-a[0])/(b[0]-a[0]);const w=1+(Math.sin(y*1.7)*.18+Math.sin(y*.63)*.12)*.06;return a.slice(1).map((v,j)=>{const x=v+(b[j+1]-v)*t;return x>.05?x*w:x})});
const camp=y=>y+'/'+String((y+1)%100).padStart(2,'0');
const INV=[[2016,10479.9],[2017,10402.8],[2018,10551.6],[2019,11601.1],[2020,9989.3],[2021,13366.9],[2022,16456.2],[2023,15360.9],[2024,13880.0],[2025,14746.9]];
// key, name, short, group, cost24/25, prom5, cost25/26, inv25/26, inv24/25
const SUB=[['mt','Maíz temprano','Maíz temp.','maiz',529,null,546,2108.2,1275.7],['ma','Maíz tardío','Maíz tard.','maiz',518,null,497,3561.5,3055.5],['cc','Cebada cervecera','Cebada cerv.','cebada',452,null,444,561.0,461.8],['cf','Cebada forrajera','Cebada forr.','cebada',403,null,362,24.1,21.7],['tr','Trigo','Trigo','trigo',348,null,355,2546.7,2408.2],['gi','Girasol','Girasol','girasol',295,null,309,992.7,672.2],['s1','Soja de primera','Soja 1.ª','soja',333,null,308,3378.1,4254.6],['so','Sorgo','Sorgo','sorgo',280,null,281,210.7,300.7],['s2','Soja de segunda','Soja 2.ª','soja',288,null,252,1363.9,1429.7]];
const AVG=370;
// sub-crop colors from the BCR complex ranges (lineamientos de infografías)
const SC={mt:'#e59a2c',ma:'#eabb77',cc:'#7a695c',cf:'#a99d93',tr:'#a87a31',gi:'#dbc816',s1:'#40742a',so:'#933f06',s2:'#84bc6e'};
const light=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>150};
const EDGE='stroke:#1b1b1b;stroke-width:.7';

/* ---------- follow a crop across views ---------- */
let follow=null;
function applyHL(){document.querySelectorAll('#ch [data-crop]').forEach(n=>n.classList.toggle('dim',!!follow&&n.dataset.crop!==follow));
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(follow===c.dataset.k)));
  $('follow').innerHTML=follow?`<span class="follow"><i style="background:${col(follow)}"></i>Siguiendo: ${CN[follow]}<button type="button" id="unfollow" aria-label="Dejar de seguir">×</button></span>`:'';
  const u=$('unfollow');if(u)u.onclick=e=>{e.stopPropagation();follow=null;applyHL()}}
function setFollow(k){follow=follow===k?null:k;applyHL()}
function tagCrop(node,k){node.dataset.crop=k;node.style.cursor='pointer';node.addEventListener('click',()=>setFollow(k))}

function svgIn(){const box=$('ch');box.innerHTML='';const W=box.clientWidth,H=box.clientHeight;return {s:el('svg',{viewBox:`0 0 ${W} ${H}`},box),W,H}}
const narrow=()=>innerWidth<900;

/* ---------- charts ---------- */
function chartTotal(){
  const {s,W,H}=svgIn();const m={l:30,r:4,t:26,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const y=v=>m.t+ih-v/18000*ih,bw=iw/INV.length;
  [0,6000,12000,18000].forEach(v=>{el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),style:'stroke:var(--grid)'},s);txt(s,m.l-5,y(v)+3.5,v?fmt(v/1000)+' mil':'0',{'text-anchor':'end'})});
  txt(s,2,m.t-14,'US$ M',{style:'font-size:10px;font-weight:600'});
  INV.forEach((d,i)=>{const cx=m.l+bw*i+bw/2,w=Math.max(6,bw*.62),cur=i===INV.length-1;const g=el('g',{},s);
    el('path',{d:`M${cx-w/2},${y(0)}V${y(d[1])+3}q0,-3 3,-3H${cx+w/2-3}q3,0 3,3V${y(0)}Z`,style:`fill:${cur?'var(--bar-hi)':'var(--bar)'}`},g);
    const lab=String(d[0]%100).padStart(2,'0')+'/'+String((d[0]+1)%100).padStart(2,'0');
    if(!narrow()||i%2===1||cur)txt(g,cx,H-4,lab,{'text-anchor':'middle',style:cur?'fill:var(--ink);font-weight:700':''});
    if(cur||i===6)txt(g,cx,y(d[1])-5,fmt(d[1]),{'text-anchor':'middle',class:'v'});
    const h=el('rect',{x:m.l+bw*i,y:m.t,width:bw,height:ih,style:'fill:transparent'},g);
    hov(h,()=>{const p=INV[i-1];return `<h4>Campaña ${camp(d[0])}</h4><div class="r"><span>Inversión</span><span>US$ ${fmt(d[1])} M</span></div>`+(p?`<div class="r"><span>vs. campaña previa</span><span style="color:${d[1]>=p[1]?'var(--up)':'var(--down)'}">${pct((d[1]/p[1]-1)*100)}</span></div>`:'')})});
  el('line',{x1:m.l,x2:W-m.r,y1:y(13811),y2:y(13811),style:'stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4;pointer-events:none'},s);
  txt(s,m.l+4,y(13811)-5,'Prom. 5 campañas previas: 13.811',{style:'fill:var(--ink-2);font-size:10px;pointer-events:none'});
}

let areaMode='10';
function chartArea(){
  const {s,W,H}=svgIn();
  const idx=areaMode==='10'?years.map((_,i)=>i).slice(-10):years.map((_,i)=>i);const n=idx.length;
  const m={l:24,r:areaMode==='10'?14:8,t:18,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const x=k=>m.l+k/(n-1)*iw,y=v=>m.t+ih-v/45*ih;
  txt(s,2,m.t-8,'M ha',{style:'font-size:10px;font-weight:600'});
  [0,10,20,30,40].forEach(v=>{el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),style:'stroke:var(--grid)'},s);txt(s,m.l-5,y(v)+3.5,v,{'text-anchor':'end'})});
  if(areaMode==='10'){idx.forEach((ii,k)=>{const yy=years[ii];const lab=String(yy%100).padStart(2,'0')+'/'+String((yy+1)%100).padStart(2,'0');const last=k===n-1;
      if(!narrow()||k%2===1||last)txt(s,x(k),H-4,lab,{'text-anchor':k===0?'start':last?'end':'middle',style:last?'fill:var(--ink);font-weight:700':''})})}
  else [1900,1940,1980,2020].forEach(yy=>txt(s,x(yy-1900),H-4,String(yy),{'text-anchor':'middle'}));
  const base=idx.map(()=>0),tops=[];
  CROPS.forEach((c,j)=>{const top=idx.map((ii,k)=>base[k]+S[ii][j]);let d='M'+idx.map((_,k)=>x(k).toFixed(1)+','+y(top[k]).toFixed(1)).join('L');for(let k=n-1;k>=0;k--)d+='L'+x(k).toFixed(1)+','+y(base[k]).toFixed(1);
    const p=el('path',{d:d+'Z',style:`fill:${col(c.k)};stroke:var(--surface);stroke-width:${areaMode==='10'?1:.5}`},s);p.dataset.crop=c.k;tops.push({c,lo:base.slice(),hi:top.slice()});top.forEach((v,k)=>base[k]=v)});
  const L=base[n-1];el('circle',{cx:x(n-1),cy:y(L),r:3.5,style:'fill:var(--ink);stroke:var(--surface);stroke-width:1.5'},s);
  txt(s,x(n-1)-6,y(L)-7,fmt(L,1)+' M ha · récord',{'text-anchor':'end',class:'v'});
  const cr=el('line',{y1:m.t,y2:m.t+ih,style:'stroke:var(--ink);opacity:0;pointer-events:none'},s);
  const hit=el('rect',{x:m.l,y:m.t,width:iw,height:ih,style:'fill:transparent;cursor:pointer'},s);
  const at=ev=>{const r=s.getBoundingClientRect();let k=Math.round((ev.clientX-r.left-m.l)/iw*(n-1));k=Math.max(0,Math.min(n-1,k));return {k,vy:(m.t+ih-(ev.clientY-r.top))/ih*45}};
  const html=k=>{const ii=idx[k];const tot=S[ii].reduce((a,b)=>a+b,0);return `<h4>Campaña ${camp(years[ii])}</h4>`+CROPS.slice().reverse().map(c=>`<div class="r"><span><i style="background:${col(c.k)}"></i>${c.n}</span><span>${fmt(S[ii][CROPS.indexOf(c)],1)}</span></div>`).join('')+`<div class="r t"><span>Total</span><span>${fmt(tot,1)} M ha</span></div>`};
  hit.addEventListener('pointermove',ev=>{const {k}=at(ev);cr.setAttribute('x1',x(k));cr.setAttribute('x2',x(k));cr.style.opacity=.45;showTip(ev,html(k))});
  hit.addEventListener('pointerleave',()=>{hideTip();cr.style.opacity=0});
  hit.addEventListener('click',ev=>{const {k,vy}=at(ev);const t=tops.find(o=>vy>=o.lo[k]&&vy<=o.hi[k]);if(t)setFollow(t.c.k);showTip(ev,html(k));ev.stopPropagation()});
}

function chartCosto(){
  const {s,W,H}=svgIn();const m={l:74,r:34,t:16,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const rows=SUB.slice().sort((a,b)=>b[6]-a[6]);const rh=ih/rows.length;const x=v=>m.l+v/620*iw;
  [0,200,400,600].forEach(v=>{el('line',{x1:x(v),x2:x(v),y1:m.t,y2:m.t+ih,style:'stroke:var(--grid)'},s);txt(s,x(v),H-3,v,{'text-anchor':'middle'})});
  rows.forEach((d,i)=>{const yy=m.t+i*rh,bh=Math.min(16,rh*.58),cy=yy+rh/2;const g=el('g',{},s);
    txt(g,m.l-6,cy+3.5,d[2],{'text-anchor':'end',style:'fill:var(--ink-2)'});
    el('rect',{x:m.l,y:cy-bh/2,width:x(d[6])-m.l,height:bh,rx:2,style:`fill:${SC[d[0]]};${EDGE}`},g);
    el('line',{x1:x(d[4]),x2:x(d[4]),y1:cy-bh/2-3,y2:cy+bh/2+3,style:'stroke:var(--ink);stroke-width:2'},g);
    txt(g,Math.max(x(d[6]),x(d[4]))+5,cy+3.5,d[6],{class:'v'});
    el('rect',{x:0,y:yy,width:W,height:rh,style:'fill:transparent'},g);tagCrop(g,d[3]);
    hov(g,()=>`<h4>${d[1]}</h4><div class="r"><span>2025/26</span><span>US$ ${d[6]}/ha</span></div><div class="r"><span>2024/25</span><span>US$ ${d[4]}/ha</span></div><div class="r t"><span>Var. interanual</span><span style="color:${d[6]>=d[4]?'var(--up)':'var(--down)'}">${pct((d[6]/d[4]-1)*100)}</span></div>`)});
  el('line',{x1:x(AVG),x2:x(AVG),y1:m.t-4,y2:m.t+ih,style:'stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3;pointer-events:none'},s);
  txt(s,x(AVG),m.t-5,'Promedio: US$ 370/ha',{'text-anchor':'middle',style:'fill:var(--ink);font-weight:700;font-size:10.5px;pointer-events:none'});
  txt(s,m.l-6,H-3,'US$/ha',{'text-anchor':'end',style:'font-size:10px;font-weight:600'});
  // key
  const k=el('g',{style:'pointer-events:none'},s);el('line',{x1:W-m.r-58,x2:W-m.r-58,y1:m.t+ih-12,y2:m.t+ih-2,style:'stroke:var(--ink);stroke-width:2'},k);txt(k,W-m.r-53,m.t+ih-3,'= 2024/25',{style:'font-size:10px'});
}

let granoMode='mek';
function chartGrano(){
  const {s,W,H}=svgIn();
  if(granoMode==='mek'){
    const m={l:28,r:4,t:14,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b;const rows=SUB.map(d=>({d,a:d[7]/d[6]}));const tot=rows.reduce((q,r)=>q+r.a,0);
    const x=v=>m.l+v/tot*iw,y=v=>m.t+ih-v/600*ih;
    [0,200,400,600].forEach(v=>{el('line',{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),style:'stroke:var(--grid)'},s);txt(s,m.l-5,y(v)+3.5,v,{'text-anchor':'end'})});
    [0,10,20,30].forEach(v=>txt(s,x(v),H-4,v+' M ha',{'text-anchor':v===0?'start':'middle'}));
    txt(s,m.l,m.t-4,'US$/ha ↑',{style:'font-size:10px'});
    let acc=0;rows.forEach(({d,a})=>{const x0=x(acc),x1=x(acc+a);acc+=a;const g=el('g',{},s);const w=x1-x0;
      el('rect',{x:x0+.5,y:y(d[6]),width:Math.max(1,w-1.5),height:y(0)-y(d[6]),rx:2,style:`fill:${SC[d[0]]};${EDGE}`},g);const tc=light(SC[d[0]])?'#193363':'#fff';
      let fit=false;if(w>40){const t1=txt(g,x0+5,y(d[6])+13,d[2],{style:`fill:${tc};font-weight:600;font-size:10.5px`});const t2=txt(g,x0+5,y(d[6])+26,'US$ '+fmt(d[7])+' M',{style:`fill:${tc};font-size:10px`});
        if(Math.max(t1.getComputedTextLength(),t2.getComputedTextLength())>w-9){t1.remove();t2.remove()}else fit=true}
      if(fit){}
      else if(w>14&&d[7]>150)txt(g,x0+w/2,y(d[6])-4,fmt(d[7]),{'text-anchor':'middle',style:'fill:var(--ink-2);font-size:9.5px'});
      tagCrop(g,d[3]);
      hov(g,()=>`<h4>${d[1]}</h4><div class="r"><span>Área</span><span>${fmt(a,2)} M ha</span></div><div class="r"><span>× costo</span><span>US$ ${d[6]}/ha</span></div><div class="r t"><span>= inversión</span><span>US$ ${fmt(d[7])} M</span></div><div class="n">${fmt(d[7]/14747*100,1)}% del total</div>`)});
  }else{
    const WF=[['24/25',13880,'t'],['Maíz',1338.5,'maiz'],['Girasol',320.5,'girasol'],['Trigo',138.5,'trigo'],['Cebada',101.6,'cebada'],['Sorgo',-90,'sorgo'],['Soja',-942.2,'soja'],['25/26',14746.9,'t']];
    const NOTE={maiz:'Maíz temprano +65,3%; total maíz +30,9%',soja:'Total soja −16,6%',girasol:'Girasol +47,7%'};
    const m={l:4,r:4,t:18,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b;const lo=12800,hi=15700,y=v=>m.t+ih-(v-lo)/(hi-lo)*ih,bw=iw/WF.length;let run=0;
    txt(s,m.l,m.t-6,'US$ M',{style:'font-size:10px;font-weight:600'});
    txt(s,W-m.r,m.t-6,'eje desde 12.800',{'text-anchor':'end',style:'font-size:9.5px'});
    WF.forEach((d,i)=>{const cx=m.l+bw*i+bw/2,w=bw*.62;let a,b;if(d[2]==='t'){a=lo;b=d[1];run=b}else{a=run;b=run+d[1];run=b}
      const top=Math.max(a,b),bot=Math.min(a,b);const g=el('g',{},s);
      el('rect',{x:cx-w/2,y:y(top),width:w,height:Math.max(2,y(bot)-y(top)),rx:2.5,style:`fill:${d[2]==='t'?'var(--bar-hi)':col(d[2])}`},g);
      if(i<WF.length-1)el('line',{x1:cx+w/2,x2:cx+bw-w/2,y1:y(run),y2:y(run),style:'stroke:var(--ink-3);stroke-dasharray:2 2'},s);
      const lab=d[2]==='t'?fmt(d[1]):sign(d[1]);
      txt(g,cx,(d[2]==='t'||d[1]>0)?y(top)-4:y(bot)+12,lab,{'text-anchor':'middle',class:'v',style:'font-size:10px'});
      txt(g,cx,H-4,d[0],{'text-anchor':'middle',style:'font-size:10px'});
      el('rect',{x:m.l+bw*i,y:m.t,width:bw,height:ih,style:'fill:transparent'},g);
      if(d[2]!=='t')tagCrop(g,d[2]);
      hov(g,()=>`<h4>${d[2]==='t'?'Campaña 20'+d[0]:d[0]}</h4><div class="r"><span>${d[2]==='t'?'Inversión total':'Aporte a la variación'}</span><span>US$ ${lab} M</span></div>${NOTE[d[2]]?`<div class="n">${NOTE[d[2]]}</div>`:''}`)});
  }
}

/* ---------- views ---------- */
const ORDER=['area','costo','grano','total'];
const V={
 total:{eyebrow:'Inversión en siembra · campaña 2025/26',hero:'<span class="u">US$ </span>14.747<span class="u"> M</span>',
   delta:'<span class="up">+6,2%</span> vs. 2024/25 · <b>3.ª más alta</b> de la década',
   ctitle:'Inversión en siembra por campaña',src:'@BCRmercados en base a GEA, Márgenes Agrop. y SAGyP',chart:chartTotal,
   text:'El monto representa lo que pagaron los productores en siembra, insumos y pulverización antes de cosechar: <b>6,8% más</b> que el promedio de las últimas cinco campañas. ¿Por qué subió? Se sembraron <b>más hectáreas (+4,8%)</b> y el costo promedio por hectárea fue <b>algo mayor (+1,3%)</b>.',
   hint:'Tocá los recuadros de abajo para ver de dónde sale este número'},
 area:{eyebrow:'Área sembrada · 6 cultivos',hero:'39,9<span class="u"> M ha</span>',
   delta:'<span class="up">+4,8%</span> · <b>récord histórico</b>',
   ctitle:'Área sembrada por cultivo',src:'@BCRmercados en base a est. propias, GEA y SAGyP',chart:chartArea,chips:true,
   ctrl:()=>seg([['10','10 campañas'],['all','Desde 1900']],areaMode,v=>{areaMode=v;render(true)}),
   text:'El <b>maíz</b> marcó su máximo histórico (<b>11,0 M ha</b>) y la <b>soja cayó 8%</b> (16,4 M ha). El girasol tuvo su mayor área en 26 años (3,2 M ha) y el trigo, en 29 (7,1 M ha). Que crezca el maíz importa: es el cultivo más caro de sembrar.',
   cta:['¿Cuánto cuesta cada hectárea?','costo']},
 costo:{eyebrow:'Costo de siembra por hectárea',hero:'<span class="u">US$ </span>370<span class="u">/ha</span>',
   delta:'promedio ponderado · <span class="up">+1,3%</span> vs. 2024/25',
   ctitle:'Costo de siembra por hectárea',src:'@BCRmercados en base a GEA y Márgenes Agropecuarios',chart:chartCosto,
   text:'El <b>maíz</b> es el más caro de implantar: <b>US$ 546/ha</b> el temprano y US$ 497/ha el tardío. La soja de primera cuesta US$ 308/ha. Como el maíz ganó superficie, el promedio subió aunque la soja y el maíz tardío se abarataron.',
   cta:['Multiplicá por las hectáreas','grano']},
 grano:{eyebrow:'Inversión en maíz · el grano n.º 1',hero:'<span class="u">US$ </span>5.670<span class="u"> M</span>',
   delta:'<span class="up">+30,9%</span> · desplazó a la <b>soja</b> (US$ 4.742 M, −16,6%)',
   ctitle:()=>granoMode==='mek'?'Hectáreas × costo = inversión':'Variación de la inversión vs. 2024/25',src:'@BCRmercados en base a GEA, Márgenes Agrop. y SAGyP',chart:chartGrano,chips:true,
   ctrl:()=>seg([['mek','Área × costo'],['wf','Qué cambió']],granoMode,v=>{granoMode=v;render(true)}),
   text:'Cada rectángulo es un grano: su superficie es lo invertido. El <b>maíz temprano</b> creció 65,3% y el <b>girasol</b>, 47,7%; la soja restó US$ 942 M. Sumando todos los granos se llega al total.',
   cta:['Ver el total','total']}
};
function seg(opts,cur,on){const d=document.createElement('div');d.className='seg';d.setAttribute('role','group');
  opts.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>on(v);d.appendChild(b)});return d}

const chips=$('chips');
CROPS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=c.k;b.innerHTML=`<i style="background:${col(c.k)}"></i>${c.n}`;b.onclick=()=>setFollow(c.k);chips.appendChild(b)});

let cur='total';
function render(onlyChart){
  const v=V[cur];
  if(!onlyChart){
    $('eyebrow').textContent=v.eyebrow;$('hero').innerHTML=v.hero;$('delta').innerHTML=v.delta;
    $('text').innerHTML=`<p>${v.text}</p>`+(v.hint?`<p class="hint"><span class="arr" aria-hidden="true">↓</span>${v.hint}</p>`:`<button type="button" class="cta" id="cta">${v.cta[0]} <span>→</span></button>`);
    if(v.cta)$('cta').onclick=()=>go(v.cta[1]);
    chips.hidden=!v.chips;
    const chain=document.querySelector('.chain');chain.classList.toggle('invite',cur==='total');
    document.querySelectorAll('.node').forEach(n=>n.toggleAttribute('aria-current',false));
    document.querySelector(`.node[data-v="${cur}"]`).setAttribute('aria-current','step');
    const ch=$('ch');ch.classList.remove('swap');void ch.offsetWidth;ch.classList.add('swap');
  }
  const tt=typeof v.ctitle==='function'?v.ctitle():v.ctitle;$('ctitle').textContent=tt;$('ctitle').title=tt;$('csrc').textContent=v.src;$('csrc').title=v.src;
  const c=$('ctrl');c.innerHTML='';if(v.ctrl)c.appendChild(v.ctrl());
  requestAnimationFrame(()=>{v.chart();applyHL()});
}
function go(v){if(!V[v]||v===cur)return;cur=v;hideTip();render();try{history.replaceState(null,'','#'+v)}catch(e){}}
document.querySelectorAll('.node').forEach(n=>n.onclick=()=>go(n.dataset.v));

// swipe + keys along the chain
let sx=null,sy=null;const app=$('app');
app.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const i=ORDER.indexOf(cur);go(ORDER[Math.max(0,Math.min(3,i+(dx<0?1:-1)))])}},{passive:true});
document.addEventListener('keydown',e=>{const i=ORDER.indexOf(cur);if(e.key==='ArrowRight')go(ORDER[Math.min(3,i+1)]);if(e.key==='ArrowLeft')go(ORDER[Math.max(0,i-1)])});

const h=(location.hash||'').slice(1);if(V[h])cur=h;
let raf;new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{V[cur].chart();applyHL()})}).observe($('ch'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{V[cur].chart();applyHL()});
render();
})();
</script>
